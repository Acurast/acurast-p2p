include:
  - project: "papers/papers-internal/internal"
    file: "/.base-gitlab-ci.yml"

variables:
  ANDROID_IMAGE: acurast-iroh-android:$CI_COMMIT_SHA
  ANDROID_CONTAINER: acurast-iroh-android-$CI_PIPELINE_ID

# fmt, clippy and the Rust tests (host).
test:
  stage: test
  image: rust:1.94.0
  before_script:
    - ./ci/git-auth.sh
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test

# Android library (AAR) for arm64-v8a and armeabi-v7a.
build:android:
  stage: build
  script:
    - docker build -f ci/android.Dockerfile -t $ANDROID_IMAGE .
    - docker run --name $ANDROID_CONTAINER -e CI_JOB_TOKEN $ANDROID_IMAGE
      sh -c "./ci/git-auth.sh && make android"
    - docker cp $ANDROID_CONTAINER:/app/android/lib/build/outputs/aar/lib-release.aar acurast-iroh-$CI_COMMIT_SHORT_SHA.aar
  after_script:
    - docker rm -f $ANDROID_CONTAINER || true
  artifacts:
    paths:
      - acurast-iroh-$CI_COMMIT_SHORT_SHA.aar

# Swift package with the xcframework, built on the macOS runner like AcurastSDK.
build:ios:
  stage: build
  before_script:
    - ./ci/git-auth.sh
  script:
    - make ios
  artifacts:
    paths:
      - AcurastIroh
  tags:
    - ios

# Publishes the AAR to this project's Maven registry as com.acurast:acurast-iroh:<tag without v>.
publish:android:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - docker build -f ci/android.Dockerfile -t $ANDROID_IMAGE .
    - docker run --rm -e CI_JOB_TOKEN -e CI_API_V4_URL -e CI_PROJECT_ID -e CI_COMMIT_TAG $ANDROID_IMAGE
      sh -c "./ci/git-auth.sh && cd android && ./gradlew :lib:publish"
